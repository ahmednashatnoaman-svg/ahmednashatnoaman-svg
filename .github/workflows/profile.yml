name: Profile Pipeline

# Rebuilds the generated regions of README.md from live GitHub data.
# The snake lives in snake.yml because it targets the orphan `output` branch;
# keeping the two apart means neither can lose a race for the tip of `main`.
#
# Third-party actions are pinned to immutable commit SHAs, not tags. A tag can
# be repointed by whoever owns the repository; this job holds `contents: write`,
# so a moved tag would be a direct path to committing arbitrary content here.
# Dependabot (.github/dependabot.yml) proposes SHA bumps as reviewable PRs.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily — off the hour to dodge the
  workflow_dispatch:        # stampede that rate-limits shared card services

concurrency:
  group: profile-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Rebuild profile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Sync README from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_profile.py

      - name: Commit regenerated assets
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage paths one at a time. `git add a b c` aborts and stages
          # NOTHING if any single pathspec is missing, which silently swallowed
          # a good README rebuild the first time this ran.
          for path in README.md; do
            if [ -e "$path" ]; then
              git add -A -- "$path"
            else
              echo "::warning::expected output '$path' was not produced"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nothing changed — profile is already current."
            exit 0
          fi

          git commit -m "chore(profile): rebuild dynamic sections [skip ci]"
          git pull --rebase --autostash origin main
          git push
