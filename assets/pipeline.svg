<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" width="400" height="342" role="img" aria-label="AI pipeline: raw data to embeddings to vector retrieval to LLM reasoning to a grounded decision">
  <title>From raw data to a grounded decision</title>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7AA2F7" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#BB9AF7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7DCFFF"/>
      <stop offset="50%"  stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#9ECE6A"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#7DCFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M 62 66 L 62 300"/>
  </defs>

  <rect x="1" y="1" width="398" height="340" rx="16" fill="#1A1B27" stroke="url(#frame)" stroke-width="1.5"/>

  <text x="24" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"
        letter-spacing="2.4" fill="#565F89">RETRIEVAL&#8201;&#183;&#8201;AUGMENTED&#8201;&#183;&#8201;PIPELINE</text>

  <!-- vertical rail: pulses travel behind the stage cards, so data visibly
       enters a stage, is "processed", and emerges on the far side -->
  <line x1="62" y1="66" x2="62" y2="300" stroke="#414868" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="66" x2="62" y2="300" stroke="url(#rail)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="10 14" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.9s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#glow)">
    <circle r="9" fill="url(#spark)">
      <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion>
    </circle>
    <circle r="9" fill="url(#spark)" opacity="0.7">
      <animateMotion dur="3.4s" begin="1.13s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    </circle>
    <circle r="9" fill="url(#spark)" opacity="0.45">
      <animateMotion dur="3.4s" begin="2.26s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    </circle>
  </g>

  <!-- stage cards -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">

    <g transform="translate(0,50)">
      <rect x="40" y="0" width="336" height="44" rx="10" fill="#24283B" stroke="#7DCFFF" stroke-opacity="0.35"/>
      <circle cx="62" cy="22" r="7" fill="#1A1B27" stroke="#7DCFFF" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="20" font-size="13" font-weight="600" fill="#C0CAF5">Raw&#160;Sources</text>
      <text x="84" y="35" font-size="10" fill="#565F89">PDFs &#183; guidelines &#183; sensor &amp; market streams</text>
    </g>

    <g transform="translate(0,110)">
      <rect x="40" y="0" width="336" height="44" rx="10" fill="#24283B" stroke="#7AA2F7" stroke-opacity="0.35"/>
      <circle cx="62" cy="22" r="7" fill="#1A1B27" stroke="#7AA2F7" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="20" font-size="13" font-weight="600" fill="#C0CAF5">Chunk&#160;&amp;&#160;Embed</text>
      <text x="84" y="35" font-size="10" fill="#565F89">section-aware splitting &#183; local embeddings</text>
    </g>

    <g transform="translate(0,170)">
      <rect x="40" y="0" width="336" height="44" rx="10" fill="#24283B" stroke="#BB9AF7" stroke-opacity="0.35"/>
      <circle cx="62" cy="22" r="7" fill="#1A1B27" stroke="#BB9AF7" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="20" font-size="13" font-weight="600" fill="#C0CAF5">Vector&#160;Retrieval</text>
      <text x="84" y="35" font-size="10" fill="#565F89">hybrid search &#183; rerank &#183; Precision@k tuned</text>
    </g>

    <g transform="translate(0,230)">
      <rect x="40" y="0" width="336" height="44" rx="10" fill="#24283B" stroke="#E0AF68" stroke-opacity="0.35"/>
      <circle cx="62" cy="22" r="7" fill="#1A1B27" stroke="#E0AF68" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="20" font-size="13" font-weight="600" fill="#C0CAF5">Agentic&#160;Reasoning</text>
      <text x="84" y="35" font-size="10" fill="#565F89">LangGraph supervisor &#183; tools &#183; guardrails</text>
    </g>

    <g transform="translate(0,282)">
      <rect x="40" y="0" width="336" height="40" rx="10" fill="#1F2335" stroke="#9ECE6A" stroke-opacity="0.55"/>
      <circle cx="62" cy="20" r="7" fill="#9ECE6A" opacity="0.9">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="18" font-size="13" font-weight="600" fill="#9ECE6A">Grounded&#160;Decision</text>
      <text x="84" y="32" font-size="10" fill="#565F89">cited, evaluated, and cheap enough to run</text>
    </g>

  </g>
</svg>
